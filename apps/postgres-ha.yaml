apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres-ha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: postgres-ha

  source:
    repoURL: https://github.com/JoseBerrocal/platform-capstone.git
    targetRevision: main
    path: platform/postgres-ha

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
