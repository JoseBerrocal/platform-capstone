apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc14-reliability-tenant-a-oci
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/joseberrocal/charts
      chart: tenant-platform
      targetRevision: 0.1.2
      helm:
        valueFiles:
          - $values/workloads/poc14-reliability/tenant-a-values.yaml

    - repoURL: https://github.com/JoseBerrocal/platform-capstone.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: poc14-reliability-tenant-a

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true