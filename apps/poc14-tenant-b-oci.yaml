apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc14-reliability-tenant-b-oci
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: ghcr.io/joseberrocal/charts
      chart: tenant-platform
      targetRevision: 0.1.4
      helm:
        valueFiles:
          - $values/workloads/poc14-reliability/tenant-b-values.yaml

    - repoURL: https://github.com/JoseBerrocal/platform-capstone.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: poc14-reliability-tenant-b

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true