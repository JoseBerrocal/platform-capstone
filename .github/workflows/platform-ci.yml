name: Platform CI

on:
  push:
    paths:
      - "client/**"
      - "server/**"

concurrency:
  group: platform-ci-main
  cancel-in-progress: false

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/poc09-client:${IMAGE_TAG} \
            ./client
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/poc09-client:${IMAGE_TAG}

      - name: Build and push server image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG} \
            ./server
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG}

      - name: Update Kubernetes manifests
        run: |
          sed -i "s|image: .*poc09-client:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/poc09-client:${IMAGE_TAG}|" \
            workloads/poc09/client-deployment.yml
          sed -i "s|image: .*poc09-server:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG}|" \
            workloads/poc09/server-deployment.yml

      - name: Commit manifest updates
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add workloads/poc09/client-deployment.yml workloads/poc09/server-deployment.yml
          git commit -m "Update app images ${IMAGE_TAG}" || echo "No changes"
          git pull --rebase origin main
          git push origin HEAD:main
