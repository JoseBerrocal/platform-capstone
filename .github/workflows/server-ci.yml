name: Server CI

on:
  push:
    paths:
      - "server/**"

jobs:
  build-push-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG} \
          ./server

      - name: Push image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG}

      - name: Update deployment
        run: |
          sed -i "s|image: .*poc09-server:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/poc09-server:${IMAGE_TAG}|" \
          workloads/poc09/server-deployment.yml

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add workloads/poc09/server-deployment.yml
          git commit -m "Update server image ${IMAGE_TAG}" || true
          git push