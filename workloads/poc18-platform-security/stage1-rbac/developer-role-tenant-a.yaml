apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: developer-tenant-a
  namespace: poc18-security-tenant-a

rules:
- apiGroups: ["", "apps"]

  resources:
    - pods
    - services
    - deployments

  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete