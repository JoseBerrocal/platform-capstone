apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-configmap-reader
  namespace: poc18-security-tenant-b
rules:
- apiGroups: [""]
  resources:
    - configmaps
  verbs:
    - get
    - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-configmap-reader-binding
  namespace: poc18-security-tenant-b
subjects:
- kind: ServiceAccount
  name: server-sa
  namespace: poc18-security-tenant-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-configmap-reader
