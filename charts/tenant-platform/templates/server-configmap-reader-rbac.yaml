apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-configmap-reader
  namespace: {{ .Values.tenant.name }}
rules:
- apiGroups: [""]
  resources:
    - configmaps
  verbs:
    - get
    - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-configmap-reader-binding
  namespace: {{ .Values.tenant.name }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccounts.server.name }}
  namespace: {{ .Values.tenant.name }}

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: server-configmap-reader